[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "spatial-reconstruction"
version = "0.1.0"
description = "Exploratory DA3-centred two-camera spatial reconstruction prototype"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.0,<2",
    "addict>=2.4,<3",
    "av>=14,<17",
    "e3nn>=0.5,<1",
    "einops>=0.8,<1",
    "evo>=1.31,<2",
    "huggingface-hub>=0.34,<2",
    "imageio>=2.37,<3",
    "matplotlib>=3.9,<4",
    "moviepy==1.0.3",
    "numpy>=1.26,<2",
    "omegaconf>=2.3,<3",
    "opencv-python>=4.10,<5",
    "pillow>=11,<13",
    "pillow-heif>=0.22,<2",
    "plyfile>=1.1,<2",
    "psutil>=6,<8",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pyyaml>=6,<7",
    # Rerun 0.23+ requires NumPy 2. Keep the latest 0.22 patch compatible
    # with this DA3/Ultralytics NumPy 1.x environment.
    "rerun-sdk==0.22.1",
    "safetensors>=0.5,<1",
    "torch>=2.7,<3",
    "torchvision>=0.22,<1",
    "transformers>=4.57,<6",
    "trimesh>=4.6,<5",
    "ultralytics>=8.3,<9",
]

[project.optional-dependencies]
# Keep PyCOLMAP out of the main MPS environment. If justified by a later work
# package, run it in an isolated process/environment to avoid its libomp
# runtime conflicting with PyTorch's bundled libomp.
colmap = [
    "pycolmap>=3.12,<4",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "types-pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spatial_reconstruction"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["spatial_reconstruction"]
